services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tslprb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tslprb}
      POSTGRES_DB: ${POSTGRES_DB:-tslprb}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5442"
    volumes:
      - tslprb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tslprb} -d ${POSTGRES_DB:-tslprb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: services/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: services/api/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://tslprb:tslprb@postgres:5442/tslprb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
      # The web image is opened on WEB_HOST_PORT, so the default origin list follows it.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_HOST_PORT:-3201},http://localhost:8081,http://localhost:19006}
    ports:
      - "${API_HOST_PORT:-8200}:8000"
    volumes:
      - ./services/api/app:/app/app
      - ./services/api/alembic:/app/alembic
      - ./services/api/tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: services/api
    command: arq app.worker.WorkerSettings
    env_file:
      - path: services/api/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://tslprb:tslprb@postgres:5442/tslprb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
    volumes:
      - ./services/api/app:/app/app
      - ./services/api/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        EXPO_PUBLIC_API: ${EXPO_PUBLIC_API:-http}
        # Baked into the bundle: the browser calls the API on the HOST port (see apps/mobile/Dockerfile).
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:${API_HOST_PORT:-8200}}
    ports:
      - "${WEB_HOST_PORT:-3201}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  tslprb_pgdata:
