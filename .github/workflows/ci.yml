name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Web export smoke
        run: pnpm --filter mobile export:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-export
          path: apps/mobile/dist
          retention-days: 3

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tslprb
          POSTGRES_PASSWORD: tslprb
          POSTGRES_DB: tslprb
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U tslprb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run pytest -q

  # F-27: a broken Dockerfile / compose file fails CI. Builds only; nothing is pushed.
  docker:
    runs-on: ubuntu-latest
    needs: [mobile, api]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker compose config
        run: docker compose config --quiet
      - name: Build the web and api images
        run: docker compose build web api
