# Production overlay for the public site: `pnpm docker:prod`
# (= docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build).
# A TLS reverse proxy on the server (Caddy, nginx, Traefik) terminates https://mocktest.brollyexamprep.com
# and forwards to 127.0.0.1:3201; the browser reaches the api through /api on that origin (Next.js proxies it
# to the api service), so 8200 is for server-side tooling only. Compose interpolation cannot read values
# from another compose file, so the public URL is restated here instead of via PUBLIC_URL.
# The website requires no login. Practice answers and results remain browser-local.
services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  api:
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mocktest.brollyexamprep.com}
  worker:
    restart: unless-stopped
  web:
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
