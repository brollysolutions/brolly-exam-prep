# Include INSIDE the existing HTTPS server block for mocktest.brollyexamprep.com.
# Replace conflicting /api locations first; keep existing TLS and website settings.
# The upstream is Next.js on the host, not FastAPI on port 8200.
# No trailing slash on proxy_pass: Next.js must receive the complete /api/... path.
location = /api {
    proxy_pass http://127.0.0.1:3201;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_cache off;
    proxy_intercept_errors off;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3201;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_cache off;
    proxy_intercept_errors off;
}
