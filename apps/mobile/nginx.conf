# nginx site for the Expo static web export (app.json web.output = "static").
# Expo writes one <route>.html per route (index.html, eligibility.html, test/[id].html …)
# plus hashed bundles under /_expo/ and /assets/. Unknown paths (dynamic routes such as
# /test/mock-07) fall back to index.html and expo-router picks the screen from the URL.

# HTML is never cached (it names the current bundle); hashed assets are immutable.
map $uri $tslprb_cache_control {
    ~*\.html$   "no-cache";
    ~^/_expo/   "public, max-age=31536000, immutable";
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "no-store";
    default     "public, max-age=3600";
}

# Path handed to the api: the request URI without the /api prefix (query string kept). Done with a
# map rather than `rewrite` so $uri keeps its /api/ prefix and the cache map above still sees it.
map $request_uri $tslprb_api_path {
    ~^/api(?<rest>/.*)$  $rest;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # MIME types (nginx:alpine's table already covers .wasm, .woff2, .ttf, .json, .map).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript application/javascript application/json
        application/wasm image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # Set once at server level: an add_header inside a location would drop these.
    add_header Cache-Control $tslprb_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    # expo-sqlite's web worker needs SharedArrayBuffer, same headers metro.config.js sends in dev.
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Hashed bundles and assets are never HTML: a purged chunk must 404, not fall back.
    location ~ ^/(?:_expo|assets)/ { try_files $uri =404; }

    # The API is reached on this same origin under /api (PUBLIC_URL/api), so the browser needs
    # neither CORS nor a second public port. The upstream is resolved through Docker's DNS on
    # every request so an api restart (new container IP) cannot strand nginx on a stale address.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $tslprb_api http://api:8000;
        proxy_pass $tslprb_api$tslprb_api_path;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
